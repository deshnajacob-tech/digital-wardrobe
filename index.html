<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1715" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Closet">
  <title>Closet – Digital Wardrobe</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="view-title">Wardrobe</h1>
      <p id="view-sub" class="muted"></p>
    </div>
    <div class="brand" aria-hidden="true">closet<span>.</span></div>
  </header>

  <main>
    <!-- WARDROBE -->
    <section id="view-wardrobe" class="view" data-title="Wardrobe">
      <div class="chips" id="wardrobe-filters"></div>
      <div class="grid" id="wardrobe-grid"></div>
      <div class="empty" id="wardrobe-empty" hidden>
        <div class="empty-art">
          <svg viewBox="0 0 24 24" class="i big"><path d="M12 6a2 2 0 1 1 2 2c-1 .5-2 1-2 2v1"/><path d="M12 11 3 17.5A1.5 1.5 0 0 0 4 20h16a1.5 1.5 0 0 0 1-2.5L12 11"/></svg>
        </div>
        <h2>Your closet is empty</h2>
        <p class="muted">Lay a piece of clothing flat on a plain floor, bed or wall and snap a photo. We'll cut it out for you.</p>
        <div class="row center">
          <label class="btn primary" for="input-camera">Take a photo</label>
          <label class="btn" for="input-upload">Upload photos</label>
        </div>
      </div>
      <div class="fab-group">
        <label class="fab secondary" for="input-upload" title="Upload from gallery">
          <svg viewBox="0 0 24 24" class="i"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m21 16-5-5-9 9"/></svg>
        </label>
        <label class="fab" for="input-camera" title="Take a photo">
          <svg viewBox="0 0 24 24" class="i"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </label>
      </div>
      <input type="file" id="input-camera" class="sr-only" accept="image/*" capture="environment">
      <input type="file" id="input-upload" class="sr-only" accept="image/*" multiple>
    </section>

    <!-- DRESS UP -->
    <section id="view-dressup" class="view" data-title="Dress up">
      <div class="dressup">
        <div class="stage-col">
          <div class="stage" id="stage">
            <div id="stage-avatar"></div>
            <div id="stage-layers"></div>
          </div>
          <div class="layer-toolbar" id="layer-toolbar" role="toolbar" aria-label="Adjust selected item">
            <button class="icon-btn" data-act="smaller" title="Smaller"><svg viewBox="0 0 24 24" class="i"><path d="M5 12h14"/></svg></button>
            <button class="icon-btn" data-act="bigger" title="Bigger"><svg viewBox="0 0 24 24" class="i"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="icon-btn" data-act="rotl" title="Rotate left"><svg viewBox="0 0 24 24" class="i"><path d="M4 4v6h6"/><path d="M4.5 10A8 8 0 1 1 6 17"/></svg></button>
            <button class="icon-btn" data-act="rotr" title="Rotate right"><svg viewBox="0 0 24 24" class="i"><path d="M20 4v6h-6"/><path d="M19.5 10A8 8 0 1 0 18 17"/></svg></button>
            <button class="icon-btn" data-act="flip" title="Mirror"><svg viewBox="0 0 24 24" class="i"><path d="M12 3v18"/><path d="M8 7 3 12l5 5z"/><path d="m16 7 5 5-5 5z"/></svg></button>
            <button class="icon-btn" data-act="forward" title="Bring forward"><svg viewBox="0 0 24 24" class="i"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
            <button class="icon-btn" data-act="back" title="Send backward"><svg viewBox="0 0 24 24" class="i"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></button>
            <button class="icon-btn danger" data-act="remove" title="Take off"><svg viewBox="0 0 24 24" class="i"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
          </div>
        </div>
        <div class="drawer">
          <div class="actions">
            <button class="btn small" id="act-shuffle">🎲 Shuffle</button>
            <button class="btn small" id="act-clear">Undress</button>
            <button class="btn small" id="act-share">Share</button>
            <button class="btn small primary" id="act-save">♡ Save look</button>
          </div>
          <div class="chips" id="drawer-filters"></div>
          <div class="drawer-grid" id="drawer-grid"></div>
          <div class="empty small" id="drawer-empty" hidden>
            <p class="muted">Nothing here yet. Add clothes to your wardrobe first.</p>
            <button class="btn primary" data-goto="wardrobe">Go to wardrobe</button>
          </div>
        </div>
      </div>
    </section>

    <!-- OUTFITS -->
    <section id="view-outfits" class="view" data-title="Outfits">
      <div class="grid tall" id="outfits-grid"></div>
      <div class="empty" id="outfits-empty" hidden>
        <h2>No saved looks yet</h2>
        <p class="muted">Dress up your avatar and tap <b>Save look</b> to keep it here.</p>
        <button class="btn primary" data-goto="dressup">Start dressing up</button>
      </div>
    </section>

    <!-- AVATAR -->
    <section id="view-avatar" class="view" data-title="Avatar">
      <div class="avatar-layout">
        <div class="avatar-preview" id="avatar-preview"></div>
        <div class="avatar-controls" id="avatar-controls"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button data-view="wardrobe">
      <svg viewBox="0 0 24 24" class="i"><path d="M12 6a2 2 0 1 1 2 2c-1 .5-2 1-2 2v1"/><path d="M12 11 3 17.5A1.5 1.5 0 0 0 4 20h16a1.5 1.5 0 0 0 1-2.5L12 11"/></svg>
      <span>Wardrobe</span>
    </button>
    <button data-view="dressup">
      <svg viewBox="0 0 24 24" class="i"><path d="M8 3 4 5.5 2.5 10l3 1.2V21h13v-9.8l3-1.2L20 5.5 16 3c-.6 1.6-2.2 2.6-4 2.6S8.6 4.6 8 3z"/></svg>
      <span>Dress up</span>
    </button>
    <button data-view="outfits">
      <svg viewBox="0 0 24 24" class="i"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      <span>Outfits</span>
    </button>
    <button data-view="avatar">
      <svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>Avatar</span>
    </button>
  </nav>

  <!-- PHOTO CLEAN-UP EDITOR -->
  <div id="editor" class="editor" hidden role="dialog" aria-modal="true" aria-label="Clean up photo">
    <header class="editor-head">
      <button class="btn ghost" id="editor-cancel">Cancel</button>
      <div class="editor-title"><strong>Cut out your piece</strong><span id="editor-counter" class="muted"></span></div>
      <button class="btn primary" id="editor-save">Add</button>
    </header>
    <div class="editor-stage" id="editor-stage"><canvas id="editor-canvas"></canvas></div>
    <div class="editor-panel">
      <p class="hint" id="editor-hint"></p>
      <div class="seg" role="group" aria-label="Tool">
        <button data-tool="wand" class="active">
          <svg viewBox="0 0 24 24" class="i"><path d="m4 20 10-10"/><path d="M15 4v2M15 12v2M20 9h-2M12 9h-2M18.5 5.5 17 7M18.5 12.5 17 11"/></svg>Magic wand
        </button>
        <button data-tool="erase">
          <svg viewBox="0 0 24 24" class="i"><path d="M7 20h10"/><path d="m5.5 13.5 7.5-7.5 5 5-7.5 7.5H8z"/></svg>Erase
        </button>
        <button data-tool="restore">
          <svg viewBox="0 0 24 24" class="i"><path d="M3 21c3 0 5-2 5-4.5a2.5 2.5 0 1 0-5 0V21z"/><path d="M8.5 13.5 19 3l2 2-10.5 10.5"/></svg>Restore
        </button>
      </div>
      <div class="row">
        <button class="btn small" id="editor-auto">✨ Auto remove</button>
        <button class="btn small" id="editor-undo">Undo</button>
        <button class="btn small" id="editor-reset">Show all</button>
      </div>
      <label class="slider"><span>Sensitivity</span><input type="range" id="editor-tol" min="8" max="120" value="40"></label>
      <label class="slider"><span>Brush size</span><input type="range" id="editor-brush" min="6" max="80" value="28"></label>
      <div class="row fields">
        <input id="editor-name" class="input" placeholder="Name (e.g. Blue denim jacket)" maxlength="40">
        <select id="editor-cat" class="input" aria-label="Category"></select>
      </div>
    </div>
  </div>

  <!-- ITEM DIALOG -->
  <dialog id="item-dialog">
    <form method="dialog" class="dialog-body">
      <div class="dialog-preview checker"><img id="item-img" alt=""></div>
      <label class="field"><span>Name</span><input id="item-name" class="input" maxlength="40"></label>
      <label class="field"><span>Category</span><select id="item-cat" class="input"></select></label>
      <div class="dialog-actions">
        <button value="done" class="btn">Done</button>
        <button value="delete" class="btn danger-ghost">Delete</button>
        <button value="wear" class="btn primary">Try it on</button>
      </div>
    </form>
  </dialog>

  <!-- OUTFIT DIALOG -->
  <dialog id="outfit-dialog">
    <form method="dialog" class="dialog-body">
      <div class="dialog-preview outfit"><img id="outfit-img" alt=""></div>
      <h3 id="outfit-name"></h3>
      <p id="outfit-date" class="muted"></p>
      <div class="dialog-actions">
        <button value="close" class="btn">Close</button>
        <button value="delete" class="btn danger-ghost">Delete</button>
        <button value="share" class="btn">Share</button>
        <button value="wear" class="btn primary">Wear it</button>
      </div>
    </form>
  </dialog>

  <!-- PROMPT / CONFIRM -->
  <dialog id="prompt-dialog">
    <form method="dialog" class="dialog-body">
      <h3 id="prompt-title"></h3>
      <p id="prompt-msg" class="muted"></p>
      <input id="prompt-input" class="input" maxlength="40">
      <div class="dialog-actions end">
        <button value="ok" class="btn primary" id="prompt-ok">Save</button>
        <button value="cancel" class="btn" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
